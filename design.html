<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>עיצוב הבית | AI Designer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=IBM+Plex+Sans+Hebrew:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #C9A84C;
    --gold-light: #E8C97A;
    --dark: #0D0D0D;
    --dark2: #141414;
    --dark3: #1C1C1C;
    --text: #E8E0D0;
    --text-muted: #8A7F6E;
    --border: rgba(201,168,76,0.2);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }

  body {
    font-family: 'IBM Plex Sans Hebrew', sans-serif;
    background: var(--dark);
    color: var(--text);
    min-height: 100vh;
    padding: 2rem 1rem;
  }

  .container {
    max-width: 860px;
    margin: 0 auto;
  }

  header {
    text-align: center;
    margin-bottom: 3rem;
    padding-bottom: 2rem;
    border-bottom: 1px solid var(--border);
  }

  header h1 {
    font-family: 'Playfair Display', serif;
    font-size: 2.8rem;
    color: var(--gold);
    margin-bottom: 0.5rem;
  }

  header p {
    color: var(--text-muted);
    font-size: 1rem;
  }

  /* API Key section */
  .api-section {
    background: var(--dark2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.5rem;
    margin-bottom: 2rem;
  }

  .api-section label {
    display: block;
    color: var(--gold);
    font-size: 0.85rem;
    font-weight: 600;
    margin-bottom: 0.6rem;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }

  .api-row {
    display: flex;
    gap: 0.75rem;
    align-items: center;
  }

  .api-row input {
    flex: 1;
    background: var(--dark3);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.75rem 1rem;
    color: var(--text);
    font-family: monospace;
    font-size: 0.9rem;
    outline: none;
    transition: border-color 0.2s;
  }

  .api-row input:focus {
    border-color: var(--gold);
  }

  .api-row input::placeholder {
    color: var(--text-muted);
  }

  .btn-save {
    background: transparent;
    border: 1px solid var(--gold);
    color: var(--gold);
    padding: 0.75rem 1.25rem;
    border-radius: 8px;
    cursor: pointer;
    font-family: 'IBM Plex Sans Hebrew', sans-serif;
    font-size: 0.9rem;
    transition: all 0.2s;
    white-space: nowrap;
  }

  .btn-save:hover {
    background: var(--gold);
    color: var(--dark);
  }

  .api-status {
    font-size: 0.8rem;
    margin-top: 0.5rem;
    color: var(--text-muted);
  }

  .api-status.saved { color: #6fcf97; }

  /* Upload section */
  .upload-section {
    margin-bottom: 2rem;
  }

  .upload-zone {
    background: var(--dark2);
    border: 2px dashed var(--border);
    border-radius: 12px;
    padding: 3rem 2rem;
    text-align: center;
    cursor: pointer;
    transition: all 0.3s;
    position: relative;
  }

  .upload-zone:hover, .upload-zone.drag-over {
    border-color: var(--gold);
    background: rgba(201, 168, 76, 0.04);
  }

  .upload-zone input[type="file"] {
    position: absolute;
    inset: 0;
    opacity: 0;
    cursor: pointer;
    width: 100%;
    height: 100%;
  }

  .upload-icon {
    font-size: 3rem;
    margin-bottom: 1rem;
    opacity: 0.6;
  }

  .upload-zone h3 {
    color: var(--text);
    font-size: 1.1rem;
    margin-bottom: 0.4rem;
  }

  .upload-zone p {
    color: var(--text-muted);
    font-size: 0.85rem;
  }

  /* Preview */
  .preview-container {
    display: none;
    margin-top: 1.5rem;
    position: relative;
  }

  .preview-container img {
    width: 100%;
    max-height: 400px;
    object-fit: contain;
    border-radius: 10px;
    border: 1px solid var(--border);
  }

  .change-photo {
    display: block;
    text-align: center;
    margin-top: 0.75rem;
    color: var(--text-muted);
    font-size: 0.85rem;
    cursor: pointer;
    text-decoration: underline;
  }

  /* Style options */
  .style-section {
    margin-bottom: 2rem;
  }

  .style-section h3 {
    color: var(--gold);
    font-size: 0.85rem;
    font-weight: 600;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    margin-bottom: 1rem;
  }

  .style-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
    gap: 0.75rem;
  }

  .style-btn {
    background: var(--dark2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 0.6rem 0.75rem;
    border-radius: 8px;
    cursor: pointer;
    font-family: 'IBM Plex Sans Hebrew', sans-serif;
    font-size: 0.85rem;
    text-align: center;
    transition: all 0.2s;
  }

  .style-btn:hover, .style-btn.active {
    border-color: var(--gold);
    color: var(--gold);
    background: rgba(201,168,76,0.07);
  }

  /* Analyze button */
  .btn-analyze {
    width: 100%;
    background: linear-gradient(135deg, var(--gold), var(--gold-light));
    color: var(--dark);
    border: none;
    padding: 1rem;
    border-radius: 10px;
    font-family: 'IBM Plex Sans Hebrew', sans-serif;
    font-size: 1.05rem;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.2s;
    margin-bottom: 2rem;
  }

  .btn-analyze:hover { opacity: 0.9; }
  .btn-analyze:disabled { opacity: 0.4; cursor: not-allowed; }

  /* Loading */
  .loading {
    display: none;
    text-align: center;
    padding: 2rem;
    color: var(--text-muted);
  }

  .spinner {
    width: 36px;
    height: 36px;
    border: 3px solid var(--border);
    border-top-color: var(--gold);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 1rem;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  /* Results */
  .results {
    display: none;
    background: var(--dark2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 2rem;
    margin-bottom: 2rem;
  }

  .results h2 {
    font-family: 'Playfair Display', serif;
    color: var(--gold);
    font-size: 1.5rem;
    margin-bottom: 1.5rem;
    padding-bottom: 1rem;
    border-bottom: 1px solid var(--border);
  }

  .results-content {
    line-height: 1.9;
    font-size: 0.95rem;
    white-space: pre-wrap;
    color: var(--text);
  }

  .results-content strong {
    color: var(--gold-light);
  }

  .error-msg {
    display: none;
    background: rgba(235, 87, 87, 0.1);
    border: 1px solid rgba(235, 87, 87, 0.3);
    border-radius: 8px;
    padding: 1rem 1.25rem;
    color: #eb5757;
    font-size: 0.9rem;
    margin-bottom: 1.5rem;
  }

  /* Back link */
  .back-link {
    display: inline-block;
    color: var(--text-muted);
    text-decoration: none;
    font-size: 0.85rem;
    margin-bottom: 2rem;
    transition: color 0.2s;
  }
  .back-link:hover { color: var(--gold); }
</style>
</head>
<body>
<div class="container">

  <a href="index.html" class="back-link">← חזרה לדף הבית</a>

  <header>
    <h1>🏠 מעצב הבית החכם</h1>
    <p>העלה תמונה של חדר ו-AI יציע לך רעיונות עיצוב מותאמים אישית</p>
  </header>

  <!-- API Key -->
  <div class="api-section">
    <label>🔑 מפתח Gemini API</label>
    <div class="api-row">
      <input type="password" id="apiKey" placeholder="הכנס את מפתח ה-API שלך מ-Google AI Studio" />
      <button class="btn-save" onclick="saveKey()">שמור</button>
    </div>
    <div class="api-status" id="apiStatus"></div>
  </div>

  <!-- Upload -->
  <div class="upload-section">
    <div class="upload-zone" id="uploadZone">
      <input type="file" id="fileInput" accept="image/*" onchange="handleFile(this.files[0])" />
      <div class="upload-icon">📸</div>
      <h3>העלה תמונה של החדר</h3>
      <p>לחץ או גרור תמונה לכאן (JPG, PNG, WEBP)</p>
    </div>
    <div class="preview-container" id="previewContainer">
      <img id="previewImg" src="" alt="תצוגה מקדימה" />
      <span class="change-photo" onclick="resetPhoto()">החלף תמונה</span>
    </div>
  </div>

  <!-- Style selection -->
  <div class="style-section">
    <h3>סגנון עיצוב מועדף</h3>
    <div class="style-grid">
      <button class="style-btn active" data-style="מודרני מינימליסטי">מינימליסטי</button>
      <button class="style-btn" data-style="סקנדינבי">סקנדינבי</button>
      <button class="style-btn" data-style="תעשייתי">תעשייתי</button>
      <button class="style-btn" data-style="בוהו-שיק">בוהו-שיק</button>
      <button class="style-btn" data-style="קלאסי יוקרתי">קלאסי</button>
      <button class="style-btn" data-style="מדיטרני">מדיטרני</button>
      <button class="style-btn" data-style="יפני זן">יפני זן</button>
      <button class="style-btn" data-style="אקלקטי צבעוני">אקלקטי</button>
    </div>
  </div>

  <!-- Analyze button -->
  <button class="btn-analyze" id="analyzeBtn" onclick="analyze()" disabled>
    ✨ נתח ועצב את החדר שלי
  </button>

  <!-- Loading -->
  <div class="loading" id="loading">
    <div class="spinner"></div>
    <p>Gemini מנתח את החדר שלך...</p>
  </div>

  <!-- Error -->
  <div class="error-msg" id="errorMsg"></div>

  <!-- Results -->
  <div class="results" id="results">
    <h2>✨ המלצות עיצוב</h2>
    <div class="results-content" id="resultsContent"></div>
  </div>

</div>

<script>
  let imageBase64 = null;
  let imageMimeType = null;
  let selectedStyle = 'מודרני מינימליסטי';

  // Load saved key
  window.onload = () => {
    const saved = localStorage.getItem('gemini_api_key');
    if (saved) {
      document.getElementById('apiKey').value = saved;
      document.getElementById('apiStatus').textContent = '✓ מפתח שמור';
      document.getElementById('apiStatus').className = 'api-status saved';
    }
    updateAnalyzeBtn();
  };

  function saveKey() {
    const key = document.getElementById('apiKey').value.trim();
    if (!key) return;
    localStorage.setItem('gemini_api_key', key);
    document.getElementById('apiStatus').textContent = '✓ מפתח נשמר בדפדפן שלך בלבד';
    document.getElementById('apiStatus').className = 'api-status saved';
    updateAnalyzeBtn();
  }

  // Style selection
  document.querySelectorAll('.style-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.style-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      selectedStyle = btn.dataset.style;
    });
  });

  // Drag & drop
  const uploadZone = document.getElementById('uploadZone');
  uploadZone.addEventListener('dragover', e => { e.preventDefault(); uploadZone.classList.add('drag-over'); });
  uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('drag-over'));
  uploadZone.addEventListener('drop', e => {
    e.preventDefault();
    uploadZone.classList.remove('drag-over');
    const file = e.dataTransfer.files[0];
    if (file && file.type.startsWith('image/')) handleFile(file);
  });

  function handleFile(file) {
    if (!file) return;
    imageMimeType = file.type;
    const reader = new FileReader();
    reader.onload = (e) => {
      const result = e.target.result;
      imageBase64 = result.split(',')[1];
      document.getElementById('previewImg').src = result;
      document.getElementById('previewContainer').style.display = 'block';
      document.getElementById('uploadZone').style.display = 'none';
      updateAnalyzeBtn();
    };
    reader.readAsDataURL(file);
  }

  function resetPhoto() {
    imageBase64 = null;
    document.getElementById('previewContainer').style.display = 'none';
    document.getElementById('uploadZone').style.display = 'block';
    document.getElementById('fileInput').value = '';
    document.getElementById('results').style.display = 'none';
    updateAnalyzeBtn();
  }

  function updateAnalyzeBtn() {
    const hasKey = !!localStorage.getItem('gemini_api_key');
    const hasImage = !!imageBase64;
    document.getElementById('analyzeBtn').disabled = !(hasKey && hasImage);
  }

  async function analyze() {
    const apiKey = localStorage.getItem('gemini_api_key');
    if (!apiKey || !imageBase64) return;

    document.getElementById('loading').style.display = 'block';
    document.getElementById('results').style.display = 'none';
    document.getElementById('errorMsg').style.display = 'none';
    document.getElementById('analyzeBtn').disabled = true;

    const prompt = `אתה מעצב פנים מקצועי ומנוסה. אנא נתח את התמונה של החדר ותן המלצות עיצוב מפורטות בעברית.

הסגנון המועדף שביקש המשתמש: ${selectedStyle}

אנא כלול בתשובה:

1. **ניתוח החדר הנוכחי** - מה קיים היום, חוזקות וחולשות
2. **המלצות לצבעים** - פלטת צבעים מוצעת לקירות, ריהוט ואביזרים
3. **ריהוט ופריסה** - איך לסדר את הריהוט, מה להחליף, מה להוסיף
4. **תאורה** - הצעות לשיפור התאורה
5. **פרטים ואביזרים** - שטיחים, כריות, צמחים, ציורים ועוד
6. **שינויים בתקציב נמוך** - 3 שינויים קטנים שיכולים לשנות את התמונה מיד

תן המלצות ספציפיות, מעשיות ומותאמות לסגנון שנבחר.`;

    try {
      const response = await fetch(
        `https://generativelanguage.googleapis.com/v1/models/gemini-1.5-flash:generateContent?key=${apiKey}`,
        {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{
              parts: [
                { inline_data: { mime_type: imageMimeType, data: imageBase64 } },
                { text: prompt }
              ]
            }],
            generationConfig: { temperature: 0.7, maxOutputTokens: 2048 }
          })
        }
      );

      const data = await response.json();

      if (!response.ok) {
        throw new Error(data.error?.message || 'שגיאה בחיבור ל-Gemini API');
      }

      const text = data.candidates?.[0]?.content?.parts?.[0]?.text;
      if (!text) throw new Error('לא התקבלה תשובה מהמודל');

      // Format bold text
      const formatted = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
      document.getElementById('resultsContent').innerHTML = formatted;
      document.getElementById('results').style.display = 'block';
      document.getElementById('results').scrollIntoView({ behavior: 'smooth' });

    } catch (err) {
      document.getElementById('errorMsg').textContent = '❌ ' + err.message;
      document.getElementById('errorMsg').style.display = 'block';
    } finally {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('analyzeBtn').disabled = false;
      updateAnalyzeBtn();
    }
  }
</script>
</body>
</html>
